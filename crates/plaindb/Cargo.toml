[package]
name = "plaindb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive", "env"] }
plaindb-core = { version = "0.1.0", path = "../plaindb-core" }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
jsonschema = { version = "0.63.1", default-features = false }
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "time"] }
