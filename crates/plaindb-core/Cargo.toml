[package]
name = "plaindb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
test-hooks = []
testgen = []

[dependencies]
arc-swap = "1.9.5"
base64 = "0.23.1"
gix = { version = "0.91.0", default-features = false, features = ["sha1", "index", "revision"] }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
json-patch = { version = "5.0.0", default-features = false }
jsonschema = { version = "0.63.1", default-features = false }
rmp-serde = "1.3.1"
rpds = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
tracing = "0.1.44"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
fastrand = "2.5.0"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bin]]
name = "plaindb-test-writer"
required-features = ["test-hooks"]
