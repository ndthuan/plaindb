[package]
name = "plaindb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
test-hooks = []
testgen = []

[dependencies]
arc-swap = "1.9.5"
base64 = "0.23.1"
gix = { version = "0.91.0", default-features = false, features = ["sha1", "index", "revision"] }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
json-patch = { version = "5.0.0", default-features = false }
jsonschema = { version = "0.63.1", default-features = false }
rmp-serde = "1.3.1"
roaring = "0.12.0"
rpds = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha1 = "0.11.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
tracing = "0.1.44"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dhat = "0.3.3"
fastrand = "2.5.0"
libc = "0.2.191"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bin]]
name = "plaindb-test-writer"
required-features = ["test-hooks"]

[[test]]
name = "testgen"
required-features = ["testgen"]

[[test]]
name = "query_oracle"
required-features = ["testgen"]

[[example]]
name = "memory"
required-features = ["testgen"]

[[example]]
name = "bench_table"

[[bench]]
name = "open_query"
harness = false
required-features = ["testgen"]

[[example]]
name = "heap"
required-features = ["testgen"]

[[test]]
name = "memory_budget"
required-features = ["testgen"]
